name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install release tools
        run: >-
          python -m pip install --only-binary=:all:
          --constraint constraints-dev.txt build tomli twine
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import tomli

          project = tomli.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected_tag = f"v{project['version']}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match package version "
                  f"{project['version']!r}; expected {expected_tag!r}"
              )
          PY
      - name: Build distributions
        env:
          PIP_ONLY_BINARY: ":all:"
        run: python -m build
      - name: Check distribution metadata and wheel contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_wheel.py dist/*.whl
          python - <<'PY'
          from pathlib import Path

          distributions = sorted(path.name for path in Path("dist").iterdir())
          wheels = [name for name in distributions if name.endswith(".whl")]
          source_distributions = [name for name in distributions if name.endswith(".tar.gz")]
          if len(distributions) != 2 or len(wheels) != 1 or len(source_distributions) != 1:
              raise SystemExit(
                  "Expected exactly one wheel and one source distribution; "
                  f"found {distributions}"
              )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shiftory
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
